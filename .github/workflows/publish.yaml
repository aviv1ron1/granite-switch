# SPDX-License-Identifier: Apache-2.0

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish
    # Only publish to production PyPI from the canonical repo. On forks this
    # job is skipped, so testing releases in a fork doesn't fire a doomed
    # production upload (the fork has no trusted publisher on PyPI).
    if: github.repository == 'generative-computing/granite-switch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        run: uv publish
