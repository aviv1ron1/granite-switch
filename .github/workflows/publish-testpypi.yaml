# SPDX-License-Identifier: Apache-2.0

# Sandbox CD: publishes to TestPyPI (test.pypi.org), NOT production PyPI.
# Runs on GitHub Releases (mirroring the real publish.yaml trigger) and can also
# be started manually for iteration. Mirrors publish.yaml (build -> OIDC
# trusted-publishing upload) but points uv at the TestPyPI index and uses a
# separate `testpypi` environment.
name: Publish to TestPyPI

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish (TestPyPI)
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for TestPyPI Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to TestPyPI
        run: >-
          uv publish
          --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
